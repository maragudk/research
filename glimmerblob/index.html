<title>Glimmerblob</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A quirky, sparkly pocket creature to feed weird snacks, boop, polish and put to bed.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=DynaPuff:wght@400;600;700&display=swap">
<style>
/* Layout: one full-bleed WebGL stage under a lagoon-night sky; stats float on top, a chunky toy tray sits at the bottom.
   Deliberately single-theme: the pet lives at night, whatever the host theme is. */
:root {
  --night: #0b1d29;
  --lagoon: #1f5462;
  --cream: #fff5e6;
  --cream-shade: #d9bfa6;
  --ink: #1d1a2e;
  --ink-soft: #5a5470;
  --butter: #ffe38a;
  --gum: #ff86bd;
  --mint: #8ef0cf;
  --peach: #ffb48c;
  --glass: rgba(9, 26, 37, 0.62);
  --glass-edge: rgba(255, 245, 230, 0.14);
  --font-display: 'Bagel Fat One', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
  --font-ui: 'DynaPuff', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--night);
  color: var(--cream);
  font-family: var(--font-ui);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
}

#sky {
  position: fixed; inset: 0;
  background:
    radial-gradient(120% 75% at 50% 42%, #2b6b72 0%, #17414f 40%, #0b1d29 78%),
    var(--night);
}
#sky::after {
  content: ""; position: absolute;
  width: 34vmin; height: 34vmin; right: -7vmin; top: 24%;
  border-radius: 50%;
  background: radial-gradient(circle at 38% 36%, #fff6e4 0%, #ffd8b4 48%, rgba(255, 196, 160, 0) 71%);
  opacity: 0.32;
}
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#dusk {
  position: fixed; inset: 0; pointer-events: none;
  background: radial-gradient(120% 90% at 50% 45%, rgba(5, 10, 30, 0.12), rgba(3, 6, 18, 0.6));
  opacity: 0; transition: opacity 1.4s ease;
}
body.night #dusk { opacity: 1; }

/* ---------- top HUD ---------- */
.hud {
  position: fixed; top: 0; left: 0; right: 0;
  padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.hud-inner { max-width: 560px; margin: 0 auto; display: grid; gap: 10px; position: relative; }
.idrow { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.ident { min-width: 0; display: grid; gap: 2px; pointer-events: auto; }
#petName {
  font-family: var(--font-display); font-size: 30px; line-height: 1.05;
  color: var(--cream); background: transparent; border: 0; padding: 0; margin: 0;
  width: 100%; max-width: 15ch; outline: none; letter-spacing: 0.01em;
  text-shadow: 0 2px 0 rgba(0, 0, 0, 0.25), 0 0 18px rgba(255, 134, 189, 0.35);
  border-radius: 8px;
}
#petName:focus-visible { box-shadow: 0 0 0 2px var(--butter); }
.meta { font-size: 13px; opacity: 0.85; display: flex; flex-wrap: wrap; gap: 4px 10px; font-variant-numeric: tabular-nums; }
.meta b { font-weight: 600; color: var(--butter); }
.tools { display: flex; gap: 8px; pointer-events: auto; flex-shrink: 0; }
.iconbtn {
  width: 40px; height: 40px; border-radius: 50%;
  border: 1px solid var(--glass-edge); background: var(--glass); color: var(--cream);
  display: grid; place-items: center; cursor: pointer; padding: 0;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.iconbtn svg { width: 20px; height: 20px; }
.iconbtn:focus-visible, .act:focus-visible, .confirm button:focus-visible { outline: 3px solid var(--butter); outline-offset: 2px; }

.stats {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;
  padding: 10px 12px; border-radius: 18px;
  background: var(--glass); border: 1px solid var(--glass-edge);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.stat { display: grid; gap: 5px; min-width: 0; }
.stat-label { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { height: 9px; border-radius: 99px; background: rgba(255, 245, 230, 0.13); overflow: hidden; }
.fill { display: block; height: 100%; width: 50%; border-radius: inherit; background: var(--c); box-shadow: 0 0 10px var(--c); transition: width 0.3s ease; }
.stat[data-stat="tummy"] { --c: var(--butter); }
.stat[data-stat="giggles"] { --c: var(--gum); }
.stat[data-stat="shine"] { --c: var(--mint); }
.stat[data-stat="pep"] { --c: var(--peach); }
.stat.low .stat-label { color: var(--c); animation: nag 1.1s ease-in-out infinite; }
@keyframes nag { 50% { opacity: 0.35; } }

.confirm {
  position: absolute; right: 0; top: 52px;
  background: var(--cream); color: var(--ink); border-radius: 16px; padding: 12px; width: 220px;
  display: grid; gap: 10px; pointer-events: auto; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  font-size: 14px; z-index: 5;
}
.confirm p { margin: 0; }
.confirm .row { display: flex; gap: 8px; }
.confirm button {
  flex: 1; font: 600 14px var(--font-ui); border-radius: 12px; border: 0; padding: 9px 6px; cursor: pointer;
  background: rgba(29, 26, 46, 0.08); color: var(--ink);
}
.confirm button.danger { background: var(--ink); color: var(--cream); }

/* ---------- action tray ---------- */
.tray-wrap {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.tray { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; pointer-events: auto; }
.act {
  font: 600 14px var(--font-ui); color: var(--ink);
  background: var(--cream); border: 0; border-radius: 22px;
  padding: 9px 4px 8px; min-height: 70px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  box-shadow: 0 5px 0 var(--cream-shade), 0 10px 22px rgba(0, 0, 0, 0.3);
  cursor: pointer; transition: transform 0.08s ease, box-shadow 0.08s ease, opacity 0.2s;
  touch-action: manipulation;
}
.act:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--cream-shade), 0 4px 10px rgba(0, 0, 0, 0.3); }
.act:disabled { opacity: 0.45; cursor: default; }
.act .ico { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--c); }
.act svg { width: 22px; height: 22px; }
[data-c="butter"] { --c: var(--butter); }
[data-c="gum"] { --c: var(--gum); }
[data-c="mint"] { --c: var(--mint); }
[data-c="peach"] { --c: var(--peach); }

/* ---------- overlays ---------- */
#speech {
  position: fixed; left: 0; top: 0; z-index: 3;
  max-width: min(240px, 70vw); padding: 9px 13px;
  background: var(--cream); color: var(--ink);
  border-radius: 18px; font-size: 15px; line-height: 1.3; text-align: center;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
  pointer-events: none; opacity: 0; transform-origin: 50% 100%;
  transition: opacity 0.18s ease;
}
#speech.show { opacity: 1; }
#speech::after {
  content: ""; position: absolute; left: var(--tail, 50%); bottom: -7px; width: 14px; height: 14px;
  background: var(--cream); transform: translateX(-50%) rotate(45deg); border-radius: 3px;
}
#hint {
  position: fixed; left: 0; right: 0; z-index: 2;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 104px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  text-align: center; pointer-events: none;
  opacity: 0; transition: opacity 0.4s ease;
}
#hint span {
  display: inline-block; padding: 8px 14px; border-radius: 99px;
  background: var(--glass); border: 1px solid var(--glass-edge); font-size: 14px;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
#hint.show { opacity: 1; }
body.egg #hint { bottom: calc(env(safe-area-inset-bottom, 0px) + 40px); }
body.egg .tray-wrap { display: none; }
body.egg .stats { visibility: hidden; }

.floater {
  position: fixed; left: 0; top: 0; z-index: 2; pointer-events: none; white-space: nowrap;
  font-family: var(--font-display); font-size: 17px; color: var(--c, var(--cream));
  text-shadow: 0 2px 0 rgba(0, 0, 0, 0.3), 0 0 12px var(--c, transparent);
  animation: floatUp 1.5s ease-out forwards;
}
.floater.z { font-size: 22px; animation-name: floatZ; animation-duration: 2.6s; --c: #cfe0ff; }
@keyframes floatUp {
  0% { transform: translate(-50%, 0) scale(0.6); opacity: 0; }
  15% { transform: translate(-50%, -14px) scale(1.1); opacity: 1; }
  100% { transform: translate(-50%, -70px) scale(1); opacity: 0; }
}
@keyframes floatZ {
  0% { transform: translate(-50%, 0) scale(0.5) rotate(-10deg); opacity: 0; }
  20% { opacity: 0.9; }
  100% { transform: translate(10px, -90px) scale(1.3) rotate(12deg); opacity: 0; }
}
#loaderr { position: fixed; inset: auto 16px 50% 16px; text-align: center; font-size: 15px; }

body.egg #btnCloset { display: none; }

/* ---------- level + xp ---------- */
.lv { display: inline-flex; align-items: center; gap: 6px; }
.xpbar { display: inline-block; width: 44px; height: 6px; border-radius: 99px; background: rgba(255, 245, 230, 0.16); overflow: hidden; }
.xpbar i { display: block; height: 100%; width: 0; background: var(--butter); border-radius: inherit; transition: width 0.4s ease; }

/* ---------- game HUD ---------- */
.gamebar {
  display: none; align-items: center; gap: 12px; padding: 10px 10px 10px 16px; border-radius: 18px;
  background: var(--glass); border: 1px solid var(--glass-edge); pointer-events: auto;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
body.gaming .gamebar { display: flex; }
body.gaming .stats, body.gaming .tray-wrap { display: none; }
.gb-score { font-family: var(--font-display); font-size: 32px; line-height: 1; font-variant-numeric: tabular-nums; min-width: 2ch; }
.gb-mid { flex: 1; min-width: 0; display: grid; gap: 6px; }
.gb-combo { font-size: 13px; font-weight: 600; color: var(--butter); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gb-time { height: 8px; border-radius: 99px; background: rgba(255, 245, 230, 0.13); overflow: hidden; }
.gb-time i { display: block; height: 100%; width: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--gum), var(--butter)); }
.gamebar .iconbtn { width: 36px; height: 36px; flex-shrink: 0; }

/* ---------- juice ---------- */
.pop {
  position: fixed; left: 0; top: 0; z-index: 6; pointer-events: none; white-space: nowrap;
  font-family: var(--font-display); font-size: var(--s, 44px); color: var(--c, var(--butter));
  text-shadow: 0 4px 0 rgba(0, 0, 0, 0.35), 0 0 24px var(--c, var(--butter));
  animation: popIn 1.1s ease-out forwards;
}
@keyframes popIn {
  0% { transform: translate(-50%, -50%) scale(0.3) rotate(-8deg); opacity: 0; }
  18% { transform: translate(-50%, -50%) scale(1.18) rotate(3deg); opacity: 1; }
  32% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
  72% { opacity: 1; }
  100% { transform: translate(-50%, -110%) scale(1); opacity: 0; }
}
.ring, .target { position: fixed; left: 0; top: 0; width: 0; height: 0; border-radius: 50%; pointer-events: none; z-index: 2; }
.target { border: 4px dashed rgba(255, 245, 230, 0.5); transition: border-color 0.08s; }
.target.beat { border-color: rgba(255, 245, 230, 0.95); }
.ring { border: 6px solid var(--c); box-shadow: 0 0 16px var(--c), inset 0 0 16px var(--c); }
#disco {
  position: fixed; inset: -50%; pointer-events: none; opacity: 0; transition: opacity 0.15s linear;
  background: repeating-conic-gradient(from 0deg, rgba(255, 134, 189, 0.5) 0deg 8deg, transparent 8deg 30deg, rgba(142, 240, 207, 0.45) 30deg 38deg, transparent 38deg 60deg, rgba(255, 227, 138, 0.45) 60deg 68deg, transparent 68deg 90deg);
  mix-blend-mode: screen; animation: discoSpin 14s linear infinite;
}
body.disco #disco { opacity: var(--disco, 0.3); }
@keyframes discoSpin { to { transform: rotate(360deg); } }

/* ---------- sheets + results ---------- */
.scrim { position: fixed; inset: 0; z-index: 6; background: rgba(4, 10, 18, 0.5); }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; max-width: 560px; margin: 0 auto;
  background: var(--cream); color: var(--ink); border-radius: 28px 28px 0 0;
  padding-top: 18px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
  padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
  box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.35); display: grid; gap: 14px; max-height: 82%; overflow-y: auto;
  animation: sheetUp 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.2);
}
@keyframes sheetUp { from { transform: translateY(40%); opacity: 0; } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sheet h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 28px; }
.sheet .close { background: rgba(29, 26, 46, 0.08); color: var(--ink); border: 0; -webkit-backdrop-filter: none; backdrop-filter: none; }
.sheet-note { margin: 0; font-size: 13px; color: var(--ink-soft); line-height: 1.4; }
.cards { display: grid; gap: 10px; }
.card {
  display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; align-items: center; gap: 12px; text-align: left;
  font: inherit; color: var(--ink); background: rgba(29, 26, 46, 0.06); border: 0; border-radius: 20px; padding: 12px; cursor: pointer;
  transition: transform 0.1s ease;
}
.card:active { transform: scale(0.98); }
.card .ico { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: var(--c); }
.card .ico svg { width: 30px; height: 30px; }
.card .txt { min-width: 0; display: grid; gap: 2px; }
.card b { font-size: 16px; }
.card .d { font-size: 13px; color: var(--ink-soft); line-height: 1.3; }
.card em { font-style: normal; font-size: 12px; font-weight: 600; background: var(--ink); color: var(--cream); padding: 4px 9px; border-radius: 99px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.closet { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.item {
  font: 600 12px var(--font-ui); color: var(--ink); background: rgba(29, 26, 46, 0.06);
  border: 3px solid transparent; border-radius: 18px; padding: 10px 4px 8px;
  display: grid; justify-items: center; gap: 4px; cursor: pointer; position: relative;
}
.item svg { width: 44px; height: 44px; }
.item.on { border-color: var(--ink); background: #ffffff; }
.item.on::after { content: "on"; position: absolute; top: 6px; right: 8px; font-size: 10px; background: var(--gum); color: var(--ink); border-radius: 99px; padding: 1px 6px; }
.item.locked { opacity: 0.45; }
.sheet button:focus-visible, .rcard button:focus-visible { outline: 3px solid var(--gum); outline-offset: 2px; }
.results {
  position: fixed; inset: 0; z-index: 8; display: grid; place-items: center; background: rgba(4, 10, 18, 0.55);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.rcard {
  width: min(340px, 100%); background: var(--cream); color: var(--ink); border-radius: 28px; padding: 22px 20px 18px;
  text-align: center; display: grid; gap: 8px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
  animation: sheetUp 0.32s cubic-bezier(0.2, 0.9, 0.3, 1.3);
}
.rcard h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 22px; }
.rscore { font-family: var(--font-display); font-size: 64px; line-height: 1; font-variant-numeric: tabular-nums; }
.rtag { justify-self: center; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; background: var(--gum); padding: 4px 10px; border-radius: 99px; }
.rlines { list-style: none; margin: 4px 0 6px; padding: 0; font-size: 14px; display: grid; gap: 4px; color: var(--ink-soft); }
.rbtns { display: flex; gap: 8px; }
.rbtns button { flex: 1; font: 600 15px var(--font-ui); border: 0; border-radius: 16px; padding: 12px; cursor: pointer; background: rgba(29, 26, 46, 0.08); color: var(--ink); }
.rbtns button.go { background: var(--ink); color: var(--cream); }
@media (prefers-reduced-motion: reduce) {
  #disco { animation: none; }
  .pop { animation-duration: 0.8s; }
}

@media (min-width: 700px) {
  #petName { font-size: 36px; }
  .act { min-height: 78px; font-size: 15px; }
}
@media (prefers-reduced-motion: reduce) {
  .floater, .floater.z { animation-duration: 0.9s; }
  .stat.low .stat-label { animation: none; }
}
</style>

<div id="sky"></div>
<canvas id="stage" aria-label="Your glimmerblob. Tap to boop, drag across it to polish."></canvas>
<div id="dusk"></div>
<div id="disco"></div>

<header class="hud">
  <div class="hud-inner">
    <div class="idrow">
      <div class="ident">
        <input id="petName" maxlength="16" spellcheck="false" autocomplete="off" aria-label="Your pet's name" value="">
        <div class="meta"><span id="age">an egg</span><span class="lv">Lv <b id="lvl">1</b><i class="xpbar" aria-hidden="true"><i id="xpfill"></i></i></span><span id="mood"></span></div>
      </div>
      <div class="tools">
        <button class="iconbtn" id="btnCloset" aria-label="Closet">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5.5a2 2 0 1 1 3 1.7c-.7.4-1 .9-1 1.6V9.5"/><path d="M12 9.5L3 16.5h18z"/></svg>
        </button>
        <button class="iconbtn" id="btnSound" aria-label="Sound on" aria-pressed="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor" stroke="none"/><path class="on" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="off" d="M16 9.5l5 5M21 9.5l-5 5" style="display:none"/></svg>
        </button>
        <button class="iconbtn" id="btnRestart" aria-label="Start over with a new egg">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12a7.5 7.5 0 1 0 2.4-5.5"/><path d="M4 4v4.5h4.5"/></svg>
        </button>
      </div>
    </div>
    <div class="stats">
      <div class="stat" data-stat="tummy" role="meter" aria-label="Tummy" aria-valuemin="0" aria-valuemax="100"><span class="stat-label">Tummy</span><span class="bar"><span class="fill"></span></span></div>
      <div class="stat" data-stat="giggles" role="meter" aria-label="Giggles" aria-valuemin="0" aria-valuemax="100"><span class="stat-label">Giggles</span><span class="bar"><span class="fill"></span></span></div>
      <div class="stat" data-stat="shine" role="meter" aria-label="Shine" aria-valuemin="0" aria-valuemax="100"><span class="stat-label">Shine</span><span class="bar"><span class="fill"></span></span></div>
      <div class="stat" data-stat="pep" role="meter" aria-label="Pep" aria-valuemin="0" aria-valuemax="100"><span class="stat-label">Pep</span><span class="bar"><span class="fill"></span></span></div>
    </div>
    <div class="gamebar" id="gamebar">
      <div class="gb-score" id="gbScore">0</div>
      <div class="gb-mid"><div class="gb-combo" id="gbCombo">Get ready…</div><div class="gb-time"><i id="gbTime"></i></div></div>
      <button class="iconbtn" id="btnQuit" aria-label="Stop the game"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="confirm" id="confirm" hidden>
      <p>Trade this blob in for a brand new egg? It can't be undone.</p>
      <div class="row"><button id="btnNo">Keep it</button><button class="danger" id="btnYes">New egg</button></div>
    </div>
  </div>
</header>

<div id="speech" role="status" aria-live="polite"></div>
<div id="hint"><span></span></div>

<div class="tray-wrap">

uniform float uTime; uniform float uWobble; uniform float uPokeAmt; uniform vec3 uPoke;
varying vec3 vN; varying vec3 vViewPos; varying vec3 vObj;
void main(){

const POINT_VS = `
attribute float aSize; attribute float aAlpha; attribute float aPhase; attribute vec3 aColor;
uniform float uTime; uniform float uScale; uniform float uTwinkle;
varying vec3 vColor; varying float vAlpha;
void main(){
  vec4 mv = modelViewMatrix * vec4(position, 1.0);
  float tw = 1.0 - uTwinkle + uTwinkle*(0.5 + 0.5*sin(uTime*(1.5 + fract(aPhase*7.13)*2.5) + aPhase*6.2831));

  float ry = max(0.0, 1.0 - abs(uv.y)*14.0)*max(0.0, 1.0 - abs(uv.x)*2.0);

const BUBBLE_VS = `
varying vec3 vN; varying vec3 vV;
void main(){

const BUBBLE_FS = `

varying vec3 vN; varying vec3 vV;

  vec3 col = 0.6 + 0.4*cos(6.2831*(f*1.3 + uTime*0.2 + uSeed + vec3(0.0, 0.33, 0.67)));

  };
  geo.setAttribute('position', new THREE.BufferAttribute(attrs.position, 3));
  geo.setAttribute('aColor', new THREE.BufferAttribute(attrs.aColor, 3));
  geo.setAttribute('aSize', new THREE.BufferAttribute(attrs.aSize, 1));
  geo.setAttribute('aAlpha', new THREE.BufferAttribute(attrs.aAlpha, 1));
  geo.setAttribute('aPhase', new THREE.BufferAttribute(attrs.aPhase, 1));
  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: pointUniforms.uTime, uScale: pointUniforms.uScale, uTwinkle: { value: twinkle } },
    vertexShader: POINT_VS, fragmentShader: POINT_FS,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  });
  const pts = new THREE.Points(geo, mat);

}

function emit(pos, count, o) {
  o = o || {};
  const speed = o.speed === undefined ? 2 : o.speed;

    tmpDir.y += o.up === undefined ? 1 : o.up;
    sparks.vel.set([tmpDir.x, tmpDir.y, tmpDir.z], i * 3);

}
function updateSparks(dt) {
  const P = sparks.attrs.position, vel = sparks.vel;
  for (let i = 0; i < sparks.n; i++) {
    if (sparks.life[i] <= 0) { sparks.attrs.aAlpha[i] = 0; sparks.attrs.aSize[i] = 0; continue; }
    sparks.life[i] -= dt;
    const j = i * 3;
    const damp = Math.max(0, 1 - sparks.drag[i] * dt);
    vel[j] *= damp; vel[j + 1] = vel[j + 1] * damp - sparks.grav[i] * dt; vel[j + 2] *= damp;
    P[j] += vel[j] * dt; P[j + 1] += vel[j + 1] * dt; P[j + 2] += vel[j + 2] * dt;
    const k = sparks.life[i] / sparks.max[i];
    const fadeIn = Math.min(1, (1 - k) * 8);
    sparks.attrs.aAlpha[i] = Math.max(0, k) * fadeIn;
    sparks.attrs.aSize[i] = sparks.base[i] * (0.5 + 0.5 * k) * fadeIn;
  }
  ['position', 'aAlpha', 'aSize', 'aColor', 'aPhase'].forEach((a) => { sparks.geo.attributes[a].needsUpdate = true; });
}
function updateField(dt) {
  const P = field.attrs.position;

  }

}

const tmpV = new V3(), tmpV2 = new V3();
function toScreen(v) {
  tmpV2.copy(v).project(camera);
  return { x: (tmpV2.x + 1) / 2 * window.innerWidth, y: (1 - tmpV2.y) / 2 * window.innerHeight };
}
function headWorld(y) { return pet.localToWorld(tmpV.set(0, y === undefined ? 2.6 : y, 0)); }
function floatText(text, color, worldPos, cls) {
  const p = toScreen(worldPos || headWorld());
  const el = document.createElement('div');
  el.className = 'floater' + (cls ? ' ' + cls : '');
  el.textContent = text;
  el.style.left = (p.x + rand(-30, 30)) + 'px';
  el.style.top = (p.y + rand(-10, 10)) + 'px';
  if (color) el.style.setProperty('--c', color);
  el.addEventListener('animationend', () => el.remove());
  document.body.appendChild(el);
}
function bump(stat, n, quiet) {
  const before = S.stats[stat];
  S.stats[stat] = clamp(before + n, 0, 100);
  const d = Math.round(S.stats[stat] - before);
  if (!quiet && d !== 0) floatText((d > 0 ? '+' : '') + d + ' ' + STAT_LABEL[stat], STAT_COLOR[stat]);
}
function moodScore() {
  const s = S.stats;
  const avg = (s.tummy + s.giggles + s.shine + s.pep) / 4;
  const min = Math.min(s.tummy, s.giggles, s.shine, s.pep);
  return avg * 0.6 + min * 0.4;
}
function moodWord() {
  if (S.asleep) return 'snoozing';
  const m = moodScore();
  return m > 80 ? 'radiant' : m > 60 ? 'bubbly' : m > 40 ? 'okay-ish' : m > 22 ? 'grumbly' : 'gloomy';
}
function moons() { return S.hatchedAt ? Math.floor((Date.now() - S.hatchedAt) / 86400000) : 0; }

  S.xp += n;
  while (S.xp >= 20 * S.level) {
    S.xp -= 20 * S.level;
    S.level += 1;

}

let snack = null;
function feed() {
  if (S.asleep) { say('zzz… snack… later…'); SFX.mumble(); return; }
  if (snack) return;
  if (phys.mode !== 'none') { say('one thing at a time. i am FLYING.'); return; }
  const idx = Math.floor(Math.random() * SNACKS.length);
  const def = SNACKS[idx];
  const mesh = def.build();
  const from = new V3(rand(-1.3, 1.3), 4.6, 1.4);
  mesh.position.copy(from);
  mesh.scale.setScalar(0.01);
  scene.add(mesh);
  snack = { mesh, def, idx, t: 0, from, phase: 'fly', vel: new V3(), age: 0 };
  A.mouthOpenTarget = 0.9;
  say('a ' + def.name + '!', 1.1);
}
const mouthWorld = new V3();
function updateSnack(dt) {
  if (!snack) return;
  const m = snack.mesh;
  snack.age += dt;
  if (snack.phase === 'fly') {
    snack.t = Math.min(1, snack.t + dt / 1.0);
    mouth.getWorldPosition(mouthWorld);
    mouthWorld.z += 0.12;
    const k = ease(snack.t);
    m.position.lerpVectors(snack.from, mouthWorld, k);
    m.position.y += Math.sin(k * Math.PI) * 0.6;
    m.rotation.x += dt * 4; m.rotation.y += dt * 5;
    m.scale.setScalar(Math.min(1, snack.t * 4) * (1 - Math.max(0, k - 0.8) * 2.5));
    if (snack.t >= 1) arriveSnack();
  } else {
    snack.vel.y -= 9 * dt;
    m.position.addScaledVector(snack.vel, dt);
    m.rotation.z += dt * 9;
    m.scale.setScalar(Math.max(0.01, 1 - snack.age / 1.3));
    if (snack.age > 1.3) { scene.remove(m); snack = null; }
  }
}
function fill(s, name) { return s.replace('{s}', name); }
function arriveSnack() {
  const def = snack.def;
  A.mouthOpenTarget = 0;
  mouth.getWorldPosition(mouthWorld);
  if (snack.idx === S.yuck) {
    snack.phase = 'spit'; snack.age = 0;
    snack.mesh.scale.setScalar(0.8);
    snack.vel.set(Math.random() < 0.5 ? -2.4 : 2.4, 3.2, 2.2);
    A.shakeT = 0.9;
    SFX.yuck(); buzz(20);
    bump('tummy', 3); bump('giggles', -5);
    say(fill(pick(YUCK_LINES), def.name));
    addXP(1);
    return;
  }
  scene.remove(snack.mesh);
  snack = null;
  const overfed = S.stats.tummy > 86;
  A.chompT = 1.0;
  SFX.chomp(0); SFX.chomp(0.2); SFX.chomp(0.4);
  kickPupils(1.5);
  emit(mouthWorld, 26, { speed: 2.2, up: 1.2, colors: [def.color, 0xffffff, 0xffe38a] });
  bump('tummy', 22);
  bump('shine', -2, true);
  if (SNACKS[S.fav] === def) {
    bump('giggles', 15);
    A.cheerT = 1.8;
    setTimeout(() => {
      say(S.favKnown ? def.name + '!! you remembered!' : def.name.toUpperCase() + '?! my favorite!!', 3);
      S.favKnown = true;
      for (let i = 0; i < 4; i++) setTimeout(() => floatText('♥', '#ff86bd'), i * 120);
      SFX.giggle();
    }, 900);
    addXP(5);
  } else {
    setTimeout(() => say(fill(pick(YUM_LINES), def.name)), 900);
    addXP(3);
  }
  if (overfed) {
    A.hiccupT = 7; A.nextHic = 1.3;
    setTimeout(() => say('hic! too many snacks. hic!'), 2400);
  }
}

// bubbles mini-game
const bubbles = [];
let round = null;
const bubbleGeo = new THREE.SphereGeometry(1, 32, 24);
function startBubbles() {
  if (S.asleep) { say('zzz… bubbles… in my dreams…'); SFX.mumble(); return; }
  if (round) return;
  if (S.stats.pep < 10) { say('too sleepy to bubble.'); return; }
  round = { left: 6, popped: 0, total: 6, next: 0 };
  hint('Tap the bubbles before they float away', 3.5);
  say('bubbles!! get them!!', 2);
  A.cheerT = 0.8;
}
function spawnBubble() {
  const gold = Math.random() < 0.18;
  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: pointUniforms.uTime, uSeed: { value: Math.random() }, uGold: { value: gold ? 1 : 0 }, uFade: { value: 0 } },
    vertexShader: BUBBLE_VS, fragmentShader: BUBBLE_FS, transparent: true, depthWrite: false,
  });
  const m = new THREE.Mesh(bubbleGeo, mat);
  const r = gold ? 0.3 : rand(0.32, 0.46);
  const side = Math.random() < 0.5 ? -1 : 1;
  m.position.set(side * rand(0.55, 1.25), rand(0.2, 1.4), rand(1.0, 1.6));
  m.scale.setScalar(r);
  scene.add(m);
  bubbles.push({ m, r, gold, age: 0, life: rand(7, 9), wob: Math.random() * 6 });
}
function updateBubbles(dt) {
  if (round && round.left > 0) {
    round.next -= dt;
    if (round.next <= 0) { spawnBubble(); round.left -= 1; round.next = rand(0.35, 0.8); }
  }
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.age += dt;
    b.m.position.y += 0.32 * dt;
    b.m.position.x += Math.sin(b.age * 1.4 + b.wob) * 0.25 * dt;
    const s = b.r * (1 + Math.sin(b.age * 3 + b.wob) * 0.04);
    b.m.scale.set(s, s * (1 - Math.sin(b.age * 3 + b.wob) * 0.04), s);
    const fadeOut = clamp((b.life - b.age) / 0.6, 0, 1);
    b.m.material.uniforms.uFade.value = Math.min(1, b.age * 3) * fadeOut;
    if (b.age >= b.life || b.m.position.y > 4.6) removeBubble(i);
  }
  if (round && round.left === 0 && bubbles.length === 0) endRound();
}
function removeBubble(i) {
  const b = bubbles[i];
  scene.remove(b.m);
  b.m.material.dispose();
  bubbles.splice(i, 1);
}
function popBubble(i) {
  const b = bubbles[i];
  SFX.pop(); buzz(12);
  emit(b.m.position, b.gold ? 40 : 22, { speed: 3, up: 0.6, gravity: 1.2, colors: b.gold ? [0xffe38a, 0xffffff, 0xffb48c] : [0x8ef0cf, 0xff86bd, 0xb9a4ff, 0xffffff] });
  bump('giggles', b.gold ? 10 : 5, true);
  bump('pep', -1.5, true);
  if (b.gold) { bump('shine', 5, true); floatText('golden!', '#ffe38a', b.m.position); }
  else floatText('+5', '#ff86bd', b.m.position);
  addXP(b.gold ? 3 : 1);
  const nowPop = performance.now();
  bubbleCombo = nowPop - lastPopAt < 1600 ? bubbleCombo + 1 : 1;
  lastPopAt = nowPop;
  if (bubbleCombo >= 2) {
    const sp = toScreen(b.m.position);
    popText('x' + bubbleCombo, '#8ef0cf', sp.x, sp.y - 34, 24 + bubbleCombo * 4);
    bump('giggles', bubbleCombo, true);
  }
  if (round) round.popped += 1;
  A.cheerT = Math.max(A.cheerT, 0.7);
  hop(0.35, 0.4);
  removeBubble(i);
}
function endRound() {
  const r = round; round = null;
  if (r.popped === r.total) {
    bump('giggles', 6);
    addXP(3);
    say('PERFECT! again! again!');
    A.spinT = 0; SFX.spin();
  } else if (r.popped === 0) {
    say('the bubbles got away. it was beautiful though.');
  } else {
    say(r.popped + (r.popped === 1 ? ' bubble! ' : ' bubbles! ') + pick(['good game.', 'my heart is fizzy.', 'again later?']));
  }
}

function playStep(step, d) {

function updateDance(dt) {

  const bp = (now - g.musicStart) / g.beat;
  const bi = Math.floor(bp);
  if (bp >= 0 && bi !== g.lastBeat) {
    g.lastBeat = bi;
    if (bi < 4) popText(['3', '2', '1', 'DANCE!'][bi], bi === 3 ? '#ff86bd' : '#ffe38a', undefined, undefined, bi === 3 ? 60 : 76);
    else A.squashV += 3.5;
    g.target.classList.add('beat');
    setTimeout(() => g.target.classList.remove('beat'), 90);
  }
  // music, scheduled a little ahead of the beat
  const a = audio();
  for (;;) {
    const st = g.musicStart + g.step * g.beat / 2;
    if (st > now + 0.2 || st > g.end) break;
    if (a && st > now - 0.03) playStep(g.step, st - now);

    l.position.set(Math.cos(ang) * 2.4, 1.6 + Math.sin(ang * 1.7) * 0.6, Math.sin(ang) * 2.4 + 0.8);

  const edge = toScreen(centre.add(new V3(1.2 * pet.scale.x, 0, 0)));

    if (until > approach) break;

// ---------------------------------------------------------------- resize
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  camDist = Math.max(2.95 / t, 2.05 / (t * camera.aspect));
  camera.updateProjectionMatrix();
  pointUniforms.uScale.value = renderer.domElement.height / (2 * t);
}
window.addEventListener('resize', resize);

function tickStats(dt) {

  s.tummy -= (100 / DRAIN.tummy) * dt * (S.asleep ? 0.6 : 1);
  s.giggles -= (100 / DRAIN.giggles) * dt * (S.asleep ? 0.3 : 1);
  s.shine -= (100 / DRAIN.shine) * dt;
  if (S.asleep) s.pep += 1.1 * dt;
  else s.pep -= (100 / DRAIN.pep) * dt;

  const py = reduceMotion ? 0 : (follow ? ndc.y * 0.2 : 0);
  cam.x += (px - cam.x) * Math.min(1, dt * 2);
  cam.y += (py - cam.y) * Math.min(1, dt * 2);
  shakeAmt *= Math.exp(-dt * 7);
  const sx = shakeAmt > 0.002 ? rand(-1, 1) * shakeAmt : 0, sy = shakeAmt > 0.002 ? rand(-1, 1) * shakeAmt : 0;
  camera.position.set(cam.x + sx, LOOK_Y + camDist * 0.17 + cam.y + sy, camDist);
  camera.lookAt(0, LOOK_Y, 0);
}
function placeSpeech() {
  if (!speechEl.classList.contains('show')) return;
  const p = toScreen(headWorld(S.phase === 'egg' ? 2.4 : 3.0));
  const w = speechEl.offsetWidth, h = speechEl.offsetHeight;
  const pad = 12;
  const hudBottom = document.querySelector('.hud-inner').getBoundingClientRect().bottom + 10;
  const x = clamp(p.x - w / 2, pad, window.innerWidth - w - pad);
  const yTop = Math.max(hudBottom, p.y - h - 10);
  speechEl.style.transform = 'translate(' + x.toFixed(1) + 'px,' + yTop.toFixed(1) + 'px)';
  speechEl.style.setProperty('--tail', clamp(p.x - x, 18, w - 18).toFixed(1) + 'px');
}

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - lastNow) / 1000, 0.05);
  lastNow = now;
  clockT += dt;
  pointUniforms.uTime.value = clockT;

  if (S.phase === 'pet') {
    tickStats(dt);
    if (G && G.type === 'catch') updateCatch(dt);
    if (G && G.type === 'dance') updateDance(dt);
    updatePet(dt);
    updatePresents(dt);
    updateShooting(dt);
    if (pointer.down && !pointer.grabbed && pointer.onBody && !G && !S.asleep && pointer.moved < 10 &&
        performance.now() - pointer.t0 > 300 && (phys.mode === 'none' || phys.mode === 'return')) startGrab();
    if (A.stormT > 0) {
      A.stormT -= dt;
      emit(tmpV3.set(rand(-2.2, 2.2), 5.4, rand(-0.5, 1.5)), 3, { speed: 0.3, up: -1.2, gravity: 1.2, drag: 0.4, size: [0.1, 0.22], life: [2, 2.8], spread: 0 });
    }
    if (G) updateGamebar();
  } else updateEgg(dt);
  updateSnack(dt);
  updateBubbles(dt);
  updateSparks(dt);
  updateField(dt);
  crystals.forEach((c) => { c.material.emissiveIntensity = (0.35 + 0.3 * Math.sin(clockT * 1.5 + c.userData.phase)) * (1 - A.sleepK * 0.6); });

  const night = A.sleepK;
  A.partyK += ((G && G.type === 'dance' ? 1 : 0) - A.partyK) * Math.min(1, dt * 3);
  hemi.intensity = (0.9 - night * 0.55) * (1 - A.partyK * 0.5);
  keyLight.intensity = (0.9 - night * 0.6) * (1 - A.partyK * 0.5);
  islandUniforms.uSleep.value = night;

  updateCamera(dt);
  renderer.render(scene, camera);

  if (speechT > 0) { speechT -= dt; if (speechT <= 0) speechEl.classList.remove('show'); }
  placeSpeech();
  if (hintT > 0) { hintT -= dt; if (hintT <= 0) hintEl.classList.remove('show'); }
  uiT -= dt;
  if (uiT <= 0) { uiT = 0.25; renderHUD(); }
  saveT -= dt;
  if (saveT <= 0) { saveT = 5; saveState(); }
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) return;
  if (G) cleanupGame();
  saveState();
});
window.addEventListener('pagehide', saveState);

// ---------------------------------------------------------------- boot
function start(hotData) {
  S = migrate(loadState(hotData) || newState());
  // catch up on time spent away (capped at 12 hours)
  const away = clamp((Date.now() - (S.lastTick || Date.now())) / 1000, 0, 12 * 3600);
  let welcome = null;
  if (S.phase === 'pet' && away > 60) {
    const wasAsleep = S.asleep;
    tickStats(away);
    if (wasAsleep && S.stats.pep >= 100) { S.asleep = false; welcome = pick(DREAM_LINES); }
    else if (away > 1800) welcome = pick(['you came back!', 'i missed you a normal amount. (a lot.)', 'i kept the island warm for you.']);
  }
  resize();
  syncSoundBtn();
  applyPhase();
  if (S.phase === 'pet') {
    if (welcome) setTimeout(() => say(welcome), 700);
    else setTimeout(() => say('hi again. i was being round.', 2.6), 900);
    setTimeout(() => hint(TIPS[S.tips++ % TIPS.length], 5), 4500);
    const today = Math.floor(Date.now() / 86400000);
    if (S.presentDay !== today) { S.presentDay = today; setTimeout(dropPresent, 2500); }
  }
  saveState();
  requestAnimationFrame((t) => { lastNow = t; frame(t); });
}
const hot = window.claude && window.claude.hot;
if (hot && hot.ready) hot.ready((d) => start(d || {}));
else start((hot && hot.data) || {});
})();
</script>
